<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Admin login</title>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,300..600;1,8..60,300..600&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap"
    />
    <link rel="stylesheet" href="/styles.css" />
    <script src="/admin/login.js" defer></script>
  </head>
  <body>
    <main class="notfound">
      <form class="form-card" method="post" action="/admin/login">
        <span class="eyebrow">Private</span>
        <h1>Site stats</h1>
        <div class="field">
          <label for="password">Admin password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required autofocus />
          <span class="err" id="login-error" role="alert"></span>
        </div>
        <p><button class="btn btn--signal" type="submit">Log in <span class="arrow" aria-hidden="true">→</span></button></p>
      </form>
    </main>
  </body>
</html>
